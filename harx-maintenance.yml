# ضعه في مستودع GitHub خاص (Private) على المسار: .github/workflows/harx-maintenance.yml
# Settings ← Secrets and variables ← Actions ← New repository secret:
#   SUPABASE_URL  (Project URL)   SUPABASE_ANON_KEY  (anon key)   SUPABASE_DB_URL  (Database → Connection string → Session pooler، بكلمة سر القاعدة)
name: Harx maintenance
on:
  schedule: [{cron: '0 3 * * 0'}]   # كل يوم أحد 3 الفجر UTC
  workflow_dispatch:
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Supabase project active
        run: curl -sS -o /dev/null -w "keepalive HTTP %{http_code}\n" "${{ secrets.SUPABASE_URL }}/rest/v1/docs?select=path&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          pg_dump "$DB_URL" --no-owner --data-only --column-inserts -t public.docs -t public.profiles -t public.counters -f harx-backup.sql
      - uses: actions/upload-artifact@v4
        with:
          name: harx-backup-${{ github.run_number }}
          path: harx-backup.sql
          retention-days: 60
